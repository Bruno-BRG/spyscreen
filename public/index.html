<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenShare — Compartilhe sua tela com um código</title>
  <meta name="description" content="Crie uma sala, compartilhe a tela com áudio da tela e convide pelo código." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="logo">🖥️</div>
        <div>ScreenShare</div>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="hero slim">
      <h1>Compartilhe sua tela <span>com um código</span></h1>
    </section>

    <section class="panels">
      <div class="card">
        <h2>➕ Criar sala</h2>
        <label for="createName">Seu nome</label>
        <input id="createName" type="text" maxlength="30" placeholder="Ex: Carlos" autocomplete="nickname" />
        <div class="row">
          <button class="btn" id="btnCreate">Criar sala</button>
        </div>
      </div>

      <div class="card">
        <h2>🔑 Entrar na sala</h2>
        <label for="joinName">Seu nome</label>
        <input id="joinName" type="text" maxlength="30" placeholder="Ex: Ana" autocomplete="nickname" />
        <label for="joinCode">Código da sala</label>
        <input id="joinCode" class="code" type="text" maxlength="10" placeholder="ABC123" autocomplete="off" spellcheck="false" />
        <div class="row">
          <button class="btn secondary" id="btnJoin">Entrar</button>
        </div>
      </div>
    </section>

    <div class="footer">ScreenShare • só tela + áudio da tela • sem microfone</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const toast = (msg) => {
      const t = $('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._h);
      t._h = setTimeout(() => (t.style.display = 'none'), 2600);
    };

    function makeCode() {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let s = '';
      const buf = new Uint32Array(6);
      crypto.getRandomValues(buf);
      for (let i = 0; i < 6; i++) s += chars[buf[i] % chars.length];
      return s;
    }

    function extractCode(raw) {
      if (!raw) return '';
      const m = String(raw).toUpperCase().match(/[A-Z0-9]{4,10}/);
      return m ? m[0] : '';
    }

    const params = new URLSearchParams(location.search);
    if (params.get('codigo')) $('joinCode').value = extractCode(params.get('codigo'));

    try {
      const saved = localStorage.getItem('ss_name');
      if (saved) { $('createName').value = saved; $('joinName').value = saved; }
    } catch {}

    function saveName(n) { try { localStorage.setItem('ss_name', n); } catch {} }

    $('btnCreate').onclick = () => {
      const name = $('createName').value.trim() || 'Anfitrião';
      saveName(name);
      const code = makeCode();
      location.href = `/sala.html?codigo=${encodeURIComponent(code)}&nome=${encodeURIComponent(name)}`;
    };

    $('btnJoin').onclick = () => {
      const name = $('joinName').value.trim() || 'Convidado';
      const code = extractCode($('joinCode').value);
      if (!code || code.length < 4) return toast('Digite um código válido (ex: ABC123)');
      saveName(name);
      location.href = `/sala.html?codigo=${encodeURIComponent(code)}&nome=${encodeURIComponent(name)}`;
    };

    $('joinCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });
    $('createName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnCreate').click(); });
  </script>
</body>
</html>
